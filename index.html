<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>damienrobson — Coming Soon</title>
    <meta
      name="description"
      content="Website relaunching soon | damienrobson"
    />

    <style>
      /* CSS Custom Properties for High Contrast / Modern Theming */
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --focus-ring: #f59e0b;
        --error-color: #f87171;
        --success-color: #4ade80;
        --font-family:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }

      /* Reset & Accessibility Defaults */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-family);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
      }

      /* Skip Link for Keyboard Navigation */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 1rem;
        background: var(--focus-ring);
        color: #000;
        padding: 0.75rem 1.25rem;
        font-weight: bold;
        text-decoration: none;
        border-radius: 0.375rem;
        z-index: 9999;
        transition: top 0.2s ease;
      }

      .skip-link:focus {
        top: 1rem;
      }

      /* Focus Styles (WCAG 2.4.7 Visible Focus) */
      :focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      /* Header */
      header {
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        padding-top: 1rem;
      }

      .logo {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-transform: uppercase;
      }

      /* Main Content */
      main {
        width: 100%;
        max-width: 36rem;
        margin: 3rem auto;
        background: var(--card-bg);
        padding: 2.5rem 2rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 2.25rem;
        line-height: 1.2;
        margin-bottom: 1rem;
        color: var(--text-main);
      }

      .subtitle {
        font-size: 1.125rem;
        color: var(--text-muted);
        margin-bottom: 2rem;
      }

      /* Accessible Form Design */
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
      }

      label {
        font-weight: 600;
        font-size: 0.875rem;
      }

      input[type='email'] {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.375rem;
        border: 1px solid var(--text-muted);
        background-color: var(--bg-color);
        color: var(--text-main);
        font-size: 1rem;
      }

      input[type='email']:focus {
        border-color: var(--accent);
      }

      button {
        background-color: var(--accent);
        color: #0f172a;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: var(--accent-hover);
        color: #ffffff;
      }

      /* Live Region for Screen Reader Announcements */
      .status-message {
        margin-top: 1rem;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .status-message.success {
        color: var(--success-color);
      }
      .status-message.error {
        color: var(--error-color);
      }

      /* Footer */
      footer {
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.875rem;
        padding-bottom: 1rem;
      }

      /* Responsive Adjustments */
      @media (max-width: 640px) {
        h1 {
          font-size: 1.75rem;
        }
        main {
          padding: 1.5rem 1.25rem;
        }
      }

      /* High Contrast Mode Adjustments */
      @media (forced-colors: active) {
        button {
          border: 2px solid CanvasText;
        }
        :focus-visible {
          outline: 3px solid CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
      <div class="logo">damienrobson.co.uk</div>
    </header>

    <main id="main-content" tabIndex="-1">
      <h1>Something great is under construction</h1>
      <p class="subtitle">
        I'm working hard behind the scenes to relaunch my website. Stay tuned.
      </p>
    </main>

    <role role="contentinfo">
      <footer>
        <p>
          &copy; <span id="year"></span> Damien Robson. All rights reserved.
        </p>
      </footer>
    </role>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
